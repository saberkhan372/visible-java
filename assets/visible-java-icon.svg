<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Visible Java</title>
  <desc id="desc">Bloom: a grid of small dots on a sun-yellow tile, with three objects popping off it along the diagonal in mint, sky and grape.</desc>

  <rect width="512" height="512" rx="120" fill="#FFC93C"/>

  <!-- The coordinate grid: the dots that stay small -->
  <g fill="#16211F">
    <circle cx="136" cy="136" r="16"/>
    <circle cx="256" cy="136" r="16"/>
    <circle cx="136" cy="256" r="16"/>
    <circle cx="376" cy="256" r="16"/>
    <circle cx="256" cy="376" r="16"/>
    <circle cx="376" cy="376" r="16"/>
  </g>

  <!-- Sticker shadows for the objects that bloom -->
  <g fill="#16211F">
    <circle cx="148" cy="388" r="34"/>
    <circle cx="268" cy="268" r="58"/>
    <circle cx="388" cy="148" r="86"/>
  </g>

  <!-- The objects, growing along the diagonal -->
  <g stroke="#16211F" stroke-width="14">
    <circle cx="136" cy="376" r="34" fill="#5FCFAF"/>
    <circle cx="256" cy="256" r="58" fill="#6FBEE2"/>
    <circle cx="376" cy="136" r="86" fill="#B497D6"/>
  </g>
  <circle cx="350" cy="108" r="16" fill="#FFFAF0"/>
</svg>
